version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: evently_mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: evently_app
    restart: always
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - MONGODB_URI=mongodb://mongodb:27017/event_booking
      - JWT_SECRET=evently_super_secure_jwt_secret_2026
      - NODE_ENV=production
    depends_on:
      - mongodb

volumes:
  mongo_data:
